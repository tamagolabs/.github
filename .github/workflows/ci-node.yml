name: Reusable TypeScript/Node & Bun CI

on:
  workflow_call:
    inputs:
      package-manager:
        description: "Gerenciador de pacotes a ser utilizado ('pnpm' ou 'bun')"
        required: false
        type: string
        default: "pnpm"
      bun-version:
        description: "Versão do Bun (quando package-manager for 'bun')"
        required: false
        type: string
        default: "latest"
      pnpm-version:
        description: "Versão do pnpm (quando package-manager for 'pnpm')"
        required: false
        type: string
        default: "latest"
      node-version:
        description: "Versão do Node.js (necessário para pnpm)"
        required: false
        type: string
        default: "latest"
      test-command:
        description: "Comando completo para executar os testes. Se vazio, a etapa é ignorada."
        required: false
        type: string
        default: ""
      build-command:
        description: "Comando completo para executar o build. Se vazio, a etapa é ignorada."
        required: false
        type: string
        default: ""
    secrets:
      GOOGLE_SERVICES_IOS_BASE64:
        required: false
      GOOGLE_SERVICES_ANDROID_BASE64:
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # --- Setup Bun ---
      - name: Setup Bun
        if: ${{ inputs.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      # --- Setup pnpm + Node.js ---
      - name: Setup pnpm
        if: ${{ inputs.package-manager == 'pnpm' }}
        uses: pnpm/setup@v3
        with:
          version: ${{ inputs.pnpm-version }}
          runtime: node@26
          cache: true
          run_install: false

      # --- Install Dependencies ---
      - name: Install Dependencies (Bun)
        if: ${{ inputs.package-manager == 'bun' }}
        run: bun install --frozen-lockfile

      - name: Install Dependencies (pnpm)
        if: ${{ inputs.package-manager == 'pnpm' }}
        run: pnpm install --frozen-lockfile

      # --- Setup Google Services ---
      - name: Setup Google Services Files (if present)
        env:
          IOS_SECRET: ${{ secrets.GOOGLE_SERVICES_IOS_BASE64 }}
          ANDROID_SECRET: ${{ secrets.GOOGLE_SERVICES_ANDROID_BASE64 }}
        run: |
          if [ -n "$IOS_SECRET" ]; then
            echo "$IOS_SECRET" | base64 --decode > GoogleService-Info.plist
          fi
          if [ -n "$ANDROID_SECRET" ]; then
            echo "$ANDROID_SECRET" | base64 --decode > google-services.json
          fi

      # --- Verification Steps ---
      - name: Run Biome Check (Lint & Format)
        run: ${{ inputs.package-manager == 'bun' && 'bunx' || 'pnpm' }} biome check --error-on-warnings .

      - name: Typecheck (tsc)
        run: ${{ inputs.package-manager == 'bun' && 'bunx' || 'pnpm' }} tsc --noEmit

      - name: Run Tests
        if: ${{ inputs.test-command != '' }}
        run: ${{ inputs.test-command }}

      - name: Run Build Command
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}
