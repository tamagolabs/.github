name: Reusable TypeScript/Node CI

on:
  workflow_call:
    inputs:
      test-command:
        description: "Comando completo para executar os testes (ex: 'pnpm vitest run'). Se vazio, a etapa é ignorada."
        required: false
        type: string
        default: ""
      build-command:
        description: "Comando completo para executar o build (ex: 'pnpm build'). Se vazio, a etapa é ignorada."
        required: false
        type: string
        default: ""
    secrets:
      GOOGLE_SERVICES_IOS_BASE64:
        required: false
      GOOGLE_SERVICES_ANDROID_BASE64:
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install pnpm + Node.js
        uses: pnpm/setup@v2
        with:
          version: 12
          cache: true

      - name: Setup Google Services Files (if present)
        env:
          IOS_SECRET: ${{ secrets.GOOGLE_SERVICES_IOS_BASE64 }}
          ANDROID_SECRET: ${{ secrets.GOOGLE_SERVICES_ANDROID_BASE64 }}
        run: |
          if [ -n "$IOS_SECRET" ]; then
            echo "$IOS_SECRET" | base64 --decode > GoogleService-Info.plist
          fi
          if [ -n "$ANDROID_SECRET" ]; then
            echo "$ANDROID_SECRET" | base64 --decode > google-services.json
          fi

      - name: Run Biome Check (Lint & Format)
        run: pnpm biome check --error-on-warnings .

      - name: Typecheck (tsc)
        run: pnpm tsc --noEmit

      - name: Run Tests
        if: ${{ inputs.test-command != '' }}
        run: ${{ inputs.test-command }}

      - name: Run Build Command
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}
